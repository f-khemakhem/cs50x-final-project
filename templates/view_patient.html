{% extends "layout.html" %}

{% block title %}Patients{% endblock %}

{% block main %}
    <form action="{{ url_for('doctor.view_patients') }}" method="get" class="d-flex col-md-5 mb-4">
        <input type="text" name="search" class="form-control form-control-sm me-2"
               placeholder="Search" autocomplete="off">
        <button type="submit" class="btn btn-sm btn-primary">Search</button>
    </form>

    <h2 class="mb-3">Patients</h2>

    {% if patients %}
        <ul class="list-group">
            {% for patient in patients %}
                <li class="list-group-item">
                    <a href="{{ url_for('doctor.patient_info', patient_id=patient.id) }}">{{ patient.name }}</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p class="text-muted">No patients found.</p>
    {% endif %}
    <a href="{{ url_for('doctor.doctor') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
{% endblock %}
