{% extends "layout.html" %}

{% block title %}Enter code{% endblock %}

{% block main %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <h2 class="mb-3">Patient code</h2>
                <form action="/enter_code" method="post">
                    <input class="form-control mb-3" name="code" placeholder="Code of the patient"
                           autocomplete="off" autofocus>
                    <button class="btn btn-primary w-100" type="submit">Add patient</button>
                </form>
            </div>
        </div>
    </div>
    <a href="{{ url_for('doctor.doctor') }}" class="btn btn-secondary mb-3">Back to Dashboard</a>
{% endblock %}
