{% extends "layout.html" %}

{% block title %}
        Add Patient
{% endblock %} 

{% block main %}
    <h1>Add Patient</h1>
    <form method="post">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" class="form-control" id="age" name="age" required>
        </div>
        <div class="form-group">
            <label for="gender">Gender</label>
            <select class="form-control" id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>
        <div class="form-group">
            <label for="chronic_illnesses">Chronic Illnesses</label>
            <textarea class="form-control" id="chronic_illnesses" name="chronic_illnesses"></textarea>
        </div>
        <div class="form-group">
            <label for="habits">Habits</label>
            <textarea class="form-control" id="habits" name="habits"></textarea>
        </div>
        <div class="form-group">
            <label for="medical_history">Medical History</label>
            <textarea class="form-control" id="medical_history" name="medical_history"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Add Patient</button>
    </form>
    <a href="{{ url_for('doctor.doctor') }}" class="btn btn-secondary mb-3">Back to Dashboard</a>
{% endblock %}
