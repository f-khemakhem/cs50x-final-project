{% extends "layout.html" %}

{% block title %}Add appointment{% endblock %}

{% block main %}
<h1 class="mb-4">Add appointment</h1>

<form action="/add_appointment" method="post" class="col-md-6">
        <select name="patient_id" class="form-select mb-3">
            <option value="" disabled selected>Choose a patient</option>
            {% for patient in patients %}
                <option value="{{ patient.id }}">{{ patient.name }}</option>
                {% endfor %}
        </select>
        
        <input type="datetime-local" name="appointment_date" class="form-control mb-3">
        
        <textarea name="notes" class="form-control mb-3" rows="2"
        placeholder="Notes (optional)"></textarea>
        
        <button type="submit" class="btn btn-success">Add</button>
    </form>
    <a href="{{ url_for('doctor.doctor') }}" class="btn btn-secondary mb-3">Back to Dashboard</a>
    {% endblock %}
